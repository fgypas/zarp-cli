name: zarp-cli
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - addict >=2.4.0
  - bidict >=0.22.0
  - email-validator >=1.2.1
  - genomepy >=0.15.0
  - jsonref >=0.2
  - numpy >=1.24, <3
  - pandas >=2.0, <3
  - pip >=22.1
  - pydantic >=2.0, <3
  - pygments >=2.8.0
  - python >=3.11, <3.14
  - rich >=12.5.1
  - apptainer >=1.3.6
  - bioconda::snakemake ==9.21.0
  - pip:
    - -e ..
